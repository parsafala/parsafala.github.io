<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parsa - Personal Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #1C2541;
            --accent: #6FB1FC;
            --text: #D4E2F4;
            --bg: #0B1929;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: linear-gradient(to top, #0B1929 0%, #1C2541 50%, #2A3F5F 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Hero background section - absolute so it scrolls with portrait */
        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            opacity: 0.25;
            background-image: url('Topbg.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            pointer-events: none;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(74, 144, 226, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(111, 177, 252, 0.08) 0%, transparent 50%);
            z-index: -2;
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 20px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lexend', sans-serif;
            font-size: 42px;
            color: var(--secondary);
            font-weight: bold;
            box-shadow: 0 8px 30px rgba(74, 144, 226, 0.25);
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: rotate(180deg) scale(1.1);
        }

        /* Portrait - height matches hero-background at 40vh */
        .portrait-container {
            text-align: center;
            height: 40vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: scaleIn 1s ease-out 0.2s backwards;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .portrait {
            width: 600px;
            height: auto;
            margin: 0;
            position: relative;
        }

        .portrait img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Hero text container - FIXED height prevents layout shifts */
        .hero-text-container {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0 15px;
        }

        .hero-text {
            font-family: 'Lexend', sans-serif;
            font-size: clamp(48px, 10vw, 96px);
            text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .hero-text.fade {
            animation: fadeInOut 0.4s ease-in-out;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Age counter */
        .age-counter {
            text-align: center;
            font-size: clamp(18px, 4vw, 24px);
            margin-bottom: 60px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 2px solid rgba(111, 177, 252, 0.15);
            backdrop-filter: blur(10px);
            animation: slideUp 1s ease-out 0.6s backwards;
        }

        .age-counter .time {
            font-size: clamp(16px, 3vw, 20px);
            color: var(--text);
            font-weight: 300;
        }

        /* Navigation carousel */
        .nav-carousel {
            position: relative;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            overflow: hidden;
            padding: 40px 0;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 40px;
            align-items: center;
            justify-content: flex-start;
        }

        .nav-card {
            position: relative;
            width: 100%;
            max-width: 1050px;
            aspect-ratio: 5 / 3;
            flex-shrink: 0;
            border-radius: 25px;
            overflow: hidden;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.4s ease, opacity 0.4s ease;
            opacity: 0.4;
            transform: scale(0.9);
        }

        .nav-card.active {
            opacity: 1;
            transform: scale(1);
            box-shadow: 0 25px 60px rgba(74, 144, 226, 0.4);
        }

        .nav-card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.3), rgba(111, 177, 252, 0.2));
            transition: transform 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 200px;
            color: rgba(255, 255, 255, 0.15);
        }

        .nav-card:hover .nav-card-bg {
            transform: scale(1.05);
        }

        .nav-card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(11, 25, 41, 0.95) 0%, transparent 60%);
            display: flex;
            align-items: flex-end;
            padding: 50px;
        }

        .nav-card-title {
            font-family: 'Lexend', sans-serif;
            font-size: 56px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
        }

        /* Fade effect on sides */
        .nav-carousel::before,
        .nav-carousel::after {
            content: '';
            position: absolute;
            top: 0;
            width: 35%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .nav-carousel::before {
            left: 0;
            background: linear-gradient(to right, #0B1929 0%, rgba(11, 25, 41, 0.6) 50%, transparent 100%);
        }

        .nav-carousel::after {
            right: 0;
            background: linear-gradient(to left, #0B1929 0%, rgba(11, 25, 41, 0.6) 50%, transparent 100%);
        }

        /* Card specific colors */
        .nav-card:nth-child(1) .nav-card-bg {
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.4), rgba(111, 177, 252, 0.3));
        }

        .nav-card:nth-child(2) .nav-card-bg {
            background: linear-gradient(135deg, rgba(111, 177, 252, 0.4), rgba(74, 144, 226, 0.3));
        }

        .nav-card:nth-child(3) .nav-card-bg {
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.35), rgba(111, 177, 252, 0.35));
        }

        .nav-card:nth-child(4) .nav-card-bg {
            background: linear-gradient(135deg, rgba(111, 177, 252, 0.35), rgba(74, 144, 226, 0.4));
        }

        .nav-card:nth-child(5) .nav-card-bg {
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.45), rgba(111, 177, 252, 0.25));
        }

        .nav-card:nth-child(6) .nav-card-bg {
            background: linear-gradient(135deg, rgba(111, 177, 252, 0.45), rgba(74, 144, 226, 0.25));
        }

        /* Carousel dots */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(111, 177, 252, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .carousel-dot.active {
            background: var(--primary);
            width: 40px;
            border-radius: 6px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-card {
                max-width: 90vw;
            }

            .nav-card-title {
                font-size: 36px;
            }

            .nav-card-bg {
                font-size: 120px;
            }

            .nav-carousel::before,
            .nav-carousel::after {
                width: 25%;
            }

            .portrait {
                width: 400px;
            }

            .hero-text-container {
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="hero-background"></div>
    <div class="container">
        <div class="header">
            <div class="logo">P</div>
        </div>

        <div class="portrait-container">
            <div class="portrait">
                <img src="mee.png" alt="Parsa">
            </div>
        </div>

        <div class="hero-text-container">
            <h1 class="hero-text">Hi, I'm Parsa</h1>
        </div>

        <div class="age-counter">
            <div class="time" id="age"></div>
        </div>

        <div class="nav-carousel">
            <div class="carousel-track" id="carouselTrack">
                <a href="#my-life" class="nav-card active">
                    <div class="nav-card-bg">🌍</div>
                    <div class="nav-card-overlay">
                        <div class="nav-card-title">My Life</div>
                    </div>
                </a>
                <a href="#achievements" class="nav-card">
                    <div class="nav-card-bg">🏆</div>
                    <div class="nav-card-overlay">
                        <div class="nav-card-title">Achievements</div>
                    </div>
                </a>
                <a href="#career" class="nav-card">
                    <div class="nav-card-bg">💼</div>
                    <div class="nav-card-overlay">
                        <div class="nav-card-title">Career</div>
                    </div>
                </a>
                <a href="#music" class="nav-card">
                    <div class="nav-card-bg">🎵</div>
                    <div class="nav-card-overlay">
                        <div class="nav-card-title">Music</div>
                    </div>
                </a>
                <a href="#sports" class="nav-card">
                    <div class="nav-card-bg">⚽</div>
                    <div class="nav-card-overlay">
                        <div class="nav-card-title">Sports</div>
                    </div>
                </a>
                <a href="#skills" class="nav-card">
                    <div class="nav-card-bg">⚡</div>
                    <div class="nav-card-overlay">
                        <div class="nav-card-title">Skills</div>
                    </div>
                </a>
            </div>
            <div class="carousel-dots" id="carouselDots">
                <div class="carousel-dot active" data-index="0"></div>
                <div class="carousel-dot" data-index="1"></div>
                <div class="carousel-dot" data-index="2"></div>
                <div class="carousel-dot" data-index="3"></div>
                <div class="carousel-dot" data-index="4"></div>
                <div class="carousel-dot" data-index="5"></div>
            </div>
        </div>
    </div>

    <script>
        function calculateAge() {
            const birthDate = new Date('2008-08-19T16:05:00+03:30');
            const now = new Date();
            
            let years = now.getFullYear() - birthDate.getFullYear();
            let months = now.getMonth() - birthDate.getMonth();
            let days = now.getDate() - birthDate.getDate();
            let hours = now.getHours() - birthDate.getHours();
            let minutes = now.getMinutes() - birthDate.getMinutes();
            let seconds = now.getSeconds() - birthDate.getSeconds();
            
            if (seconds < 0) {
                seconds += 60;
                minutes--;
            }
            
            if (minutes < 0) {
                minutes += 60;
                hours--;
            }
            
            if (hours < 0) {
                hours += 24;
                days--;
            }
            
            if (days < 0) {
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
                months--;
            }
            
            if (months < 0) {
                months += 12;
                years--;
            }
            
            const ageText = `I'm ${years} years, ${months} months, ${days} days, ${hours} hours, ${minutes} minutes, and ${seconds} seconds old`;
            document.getElementById('age').textContent = ageText;
        }
        
        calculateAge();
        setInterval(calculateAge, 1000);

        // Carousel functionality
        let currentSlide = 0;
        const track = document.getElementById('carouselTrack');
        const cards = document.querySelectorAll('.nav-card');
        const dots = document.querySelectorAll('.carousel-dot');
        const totalSlides = cards.length;

        function updateCarousel() {
            const viewportWidth = window.innerWidth;
            const cardWidth = cards[0].offsetWidth;
            const gap = 40;
            
            const centerOffset = (viewportWidth - cardWidth) / 2;
            const slideOffset = currentSlide * (cardWidth + gap);
            const offset = centerOffset - slideOffset;
            
            track.style.transform = `translateX(${offset}px)`;
            
            cards.forEach((card, index) => {
                if (index === currentSlide) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            dots.forEach((dot, index) => {
                if (index === currentSlide) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
        }

        let autoSlideInterval = setInterval(nextSlide, 4000);

        dots.forEach((dot) => {
            dot.addEventListener('click', () => {
                const index = parseInt(dot.getAttribute('data-index'));
                goToSlide(index);
                clearInterval(autoSlideInterval);
                autoSlideInterval = setInterval(nextSlide, 4000);
            });
        });

        window.addEventListener('resize', updateCarousel);
        updateCarousel();
        
        // Multilingual greeting rotation
        const greetings = [
            "Hi, I'm Parsa",
            "سلام، من پارسا هستم",
            "Hola, soy Parsa",
            "Bonjour, je suis Parsa",
            "Ciao, sono Parsa",
            "こんにちは、私はパルサです",
            "你好，我是帕尔萨",
            "Hallo, ich bin Parsa",
        ];
        
        let currentGreetingIndex = 0;
        const heroText = document.querySelector('.hero-text');
        
        function rotateGreeting() {
            heroText.classList.add('fade');
            
            setTimeout(() => {
                currentGreetingIndex = (currentGreetingIndex + 1) % greetings.length;
                heroText.textContent = greetings[currentGreetingIndex];
            }, 200);
            
            setTimeout(() => {
                heroText.classList.remove('fade');
            }, 400);
        }
        
        setInterval(rotateGreeting, 3000);
    </script>
</body>
</html>
